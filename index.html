<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЕВА — Сад решений</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11121b;color:#eee9f8;font:17px system-ui;line-height:1.5}main{max-width:680px;margin:auto;padding:32px 20px}header{letter-spacing:.6em;color:#d5c2ff}h1{font-weight:400;font-size:clamp(28px,6vw,46px)}svg{width:100%;height:240px;background:radial-gradient(ellipse,#29213c,transparent 70%)}.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}button{font:inherit;padding:12px;background:#262235;color:#fff;border:1px solid #77668f;border-radius:12px;cursor:pointer}button:focus-visible{outline:3px solid #fff}button:hover{background:#403451}small,p{color:#c7bfd4}meter{width:100%;height:18px}ol{padding-left:24px}summary{cursor:pointer}footer{margin-top:30px;font-size:14px;color:#c7bfd4}
</style><main><header>ЕВА · 001</header><h1>Сад решений</h1><p>Перед тобой маленький мир. Что ты хочешь изменить?</p>
<svg id="garden" viewBox="0 0 320 240" role="img" aria-label="Абстрактный сад"></svg>
<div id="status" aria-live="polite"></div><div class="actions"><button data-act="light">Добавить свет</button><button data-act="grow">Вырастить</button><button data-act="wild">Внести разнообразие</button><button data-act="rest">Дать отдохнуть</button></div>
<details><summary>История решений</summary><ol id="history"></ol></details><p><button id="reset">Начать заново</button></p><footer>Художественная симуляция · без ИИ-модели и сетевых запросов. Каждый выбор меняет несколько условий.</footer></main>
<script>
const initial=()=>({turn:0,light:50,growth:30,diversity:20,history:[]});
const rules={light:[20,-4,0,'Свет усилился, рост немного замедлился.'],grow:[-12,18,0,'Рост потребовал света.'],wild:[-5,-8,22,'Разнообразие увеличилось ценой ресурсов.'],rest:[8,4,-3,'Сад восстановил часть ресурсов.']};
const clamp=x=>Math.max(0,Math.min(100,x));
function transition(s,a){const r=rules[a];if(!r)return s;return {turn:s.turn+1,light:clamp(s.light+r[0]),growth:clamp(s.growth+r[1]),diversity:clamp(s.diversity+r[2]),history:[...s.history,r[3]]}}
let state=initial();
function render(){const s=state;const g=document.querySelector('#garden');g.replaceChildren();const ns='http://www.w3.org/2000/svg';for(let i=0;i<5+Math.floor(s.diversity/4);i++){const e=document.createElementNS(ns,'ellipse');e.setAttribute('cx','160');e.setAttribute('cy','120');e.setAttribute('rx',30+s.growth*.9);e.setAttribute('ry',12+s.light*.3);e.setAttribute('transform','rotate('+i*137.5+' 160 120)');e.setAttribute('fill','none');e.setAttribute('stroke','hsl('+(240+i*s.diversity/3)%360+' 75% '+(45+s.light*.35)+'%)');e.setAttribute('stroke-opacity','.55');g.append(e)}const status=document.querySelector('#status');status.replaceChildren();for(const [label,value] of [['Свет',s.light],['Рост',s.growth],['Разнообразие',s.diversity]]){const p=document.createElement('p');p.textContent=label+' · '+value;const m=document.createElement('meter');m.min=0;m.max=100;m.value=value;m.setAttribute('aria-label',label);p.append(m);status.append(p)}const h=document.querySelector('#history');h.replaceChildren();for(const line of s.history){const li=document.createElement('li');li.textContent=line;h.append(li)}}
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{state=transition(state,b.dataset.act);render()}));document.querySelector('#reset').addEventListener('click',()=>{state=initial();render()});render();
</script></html>
